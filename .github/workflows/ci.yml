name: CI

# 架构方案 P2-6：feat/PR 快速编译门禁（release.yml 仍负责发版构建）
on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 插件清单一致性门禁
        # 内置插件清单是单一真源（assets/plugin-manifest.json）；本步校验
        # 「清单 ↔ 资产目录 ↔ package.json ↔ cordis.patch.yml」四者对齐，
        # 防止再次出现「六处手工硬编码、两侧静默不一致」的历史问题。
        run: node tools/check-plugin-manifest.mjs

      - name: 前缀适配工具自测
        # 锁住 verify/repair 脚本的语义：能查出官方前缀残留、不把镜像路径误报、
        # 等长替换不改长度/权限位、幂等不二次嵌套。CI 无真机 PREFIX，故用 fixture。
        run: node tools/verify-prefix-patch.test.mjs

      - name: 插件在线升级工具自测
        # 锁住 plugin-upgrade.mjs 的两处易碎语义：①compareVersions 的方向与
        # 预发布比较（降级与否的判据全靠它）②extractTarball 的路径穿越/非普通
        # 文件拒绝（tarball 来自公网 registry，必须假定其恶意）。纯离线自测，
        # 不需要 registry 网络。
        run: node tools/plugin-upgrade.test.mjs

      - name: Assemble debug（编译门禁）
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon

      - name: Unit tests（P2-2 单测门禁）
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: 单测结果摘要（写进日志，便于无产物时核对）
        # artifact 走 Azure Blob，某些网络下取不回；把每个测试类的
        # tests/failures/errors 直接打进 job 日志，使「某类是否真的跑了、
        # 是否全过」可从日志自证，不必依赖下载产物。
        if: always()
        run: |
          set -e
          dir=app/build/test-results/testDebugUnitTest
          if [ ! -d "$dir" ]; then echo "no test-results dir"; exit 0; fi
          total=0; failed=0
          for f in "$dir"/TEST-*.xml; do
            [ -e "$f" ] || continue
            line=$(head -c 2000 "$f" | tr '\n' ' ' | sed -n 's/.*<testsuite \([^>]*\)>.*/\1/p')
            # $line 是 <testsuite 的属性串（以 name=" 开头），末尾还有
            # hostname="..."；不锚行首会贪婪匹配到 hostname 的值。
            name=$(echo "$line" | sed -n 's/^name="\([^"]*\)".*/\1/p')
            t=$(echo "$line" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p')
            fa=$(echo "$line" | sed -n 's/.*failures="\([0-9]*\)".*/\1/p')
            er=$(echo "$line" | sed -n 's/.*errors="\([0-9]*\)".*/\1/p')
            echo "TESTCLASS $name tests=$t failures=$fa errors=$er"
            total=$((total + ${t:-0})); failed=$((failed + ${fa:-0} + ${er:-0}))
          done
          echo "TESTTOTAL tests=$total failures+errors=$failed"
          if [ "$failed" -ne 0 ]; then echo "unit tests failed"; exit 1; fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
