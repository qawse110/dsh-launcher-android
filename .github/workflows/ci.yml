name: CI

# 架构方案 P2-6：feat/PR 快速编译门禁（release.yml 仍负责发版构建）
on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 插件清单一致性门禁
        # 内置插件清单是单一真源（assets/plugin-manifest.json）；本步校验
        # 「清单 ↔ 资产目录 ↔ package.json ↔ cordis.patch.yml」四者对齐，
        # 防止再次出现「六处手工硬编码、两侧静默不一致」的历史问题。
        run: node tools/check-plugin-manifest.mjs

      - name: Assemble debug（编译门禁）
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon

      - name: Unit tests（P2-2 单测门禁）
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
