name: CI

# 架构方案 P2-6：feat/PR 快速编译门禁（release.yml 仍负责发版构建）
on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 资产脚本门禁（review-r5，最快的一环放最前）：assets 下的 stub/install/routing/
      # fs 兼容层 + patched/ 补丁载荷全部做 node --check，并校验 stub 引用的载荷存在。
      # 背景：载荷此前以 base64 内嵌在 stub 里，静态检查完全看不到；抽为真实文件后
      # 这类「写坏一个上游补丁文件拖死 dsh 启动」的事故才能在 CI 暴露。
      - name: Asset scripts gate（脚本语法 + 载荷完整性）
        run: node tools/check-asset-scripts.cjs

      # ABI 门禁（本轮新增）：读内置 node 归档里 bin/node 的 ELF e_machine，
      # 与文件名声明的 ABI 双向核对。参考项目坑 18/30 是两次真机重大事故
      # （错 ABI 运行时装到真机 → 引擎启动即崩 EM_X86_64 ≠ EM_AARCH64）。
      # 依赖上面的 lfs: true —— 未拉取 LFS 时本门禁输出 SKIP 而非误报失败。
      - name: ABI gate（内置 node ELF 架构核对）
        run: node tools/check-asset-abi.cjs

      # Kotlin 静态预检（本轮新增）：括号平衡 + 块注释闭合 + 嵌套扫描。
      # Kotlin 块注释**可嵌套**——KDoc 正文里误写注释起始符会打开嵌套注释并
      # 吞掉后续代码（本项目 commit 5cf987d 与 d617620 两次真实编译失败的机理）。
      # 放在 gradle 之前：一次 node 扫描几百毫秒，能在拉 SDK/JDK 前就拦下这类笔误。
      - name: Kotlin static precheck（括号/注释）
        run: node tools/bracecheck-edited.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Assemble debug（编译门禁）
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon

      - name: Unit tests（P2-2 单测门禁）
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
