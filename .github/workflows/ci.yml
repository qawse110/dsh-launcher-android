name: CI

# 架构方案 P2-6：feat/PR 快速编译门禁（release.yml 仍负责发版构建）
on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 资产脚本门禁（review-r5，最快的一环放最前）：assets 下的 stub/install/routing/
      # fs 兼容层 + patched/ 补丁载荷全部做 node --check，并校验 stub 引用的载荷存在。
      # 背景：载荷此前以 base64 内嵌在 stub 里，静态检查完全看不到；抽为真实文件后
      # 这类「写坏一个上游补丁文件拖死 dsh 启动」的事故才能在 CI 暴露。
      - name: Asset scripts gate（脚本语法 + 载荷完整性）
        run: node tools/check-asset-scripts.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Assemble debug（编译门禁）
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon

      - name: Unit tests（P2-2 单测门禁）
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
