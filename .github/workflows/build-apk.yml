name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        type: choice
        default: debug
        options:
          - debug
          - release
          - both
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：debug 版本号依赖 git 提交计数（shallow clone 下恒为 1）
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 build-tools;36.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          VARIANT="${{ inputs.variant || 'release' }}"
          case "$VARIANT" in
            debug)
              ./gradlew :app:assembleDebug --no-daemon ;;
            release)
              ./gradlew :app:assembleRelease --no-daemon ;;
            both)
              ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon ;;
            *)
              echo "unknown variant: $VARIANT"; exit 1 ;;
          esac

      - name: Rename debug APK with commit info
        if: ${{ github.event_name == 'push' || inputs.variant == 'debug' || inputs.variant == 'both' }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD)
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            mv "$f" "app/build/outputs/apk/debug/dsh-launcher-debug-r${COUNT}-${SHORT}.apk"
          done
          ls -la app/build/outputs/apk/debug/

      - name: Upload debug APK artifact
        if: ${{ github.event_name == 'push' || inputs.variant == 'debug' || inputs.variant == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload release APK artifact
        if: ${{ github.event_name == 'push' || inputs.variant == 'release' || inputs.variant == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
