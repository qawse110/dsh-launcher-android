name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        type: choice
        default: debug
        options:
          - debug
          - release
          - both
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 资产脚本门禁（review-r5）：打包含 stub 与 patched/ 载荷，脚本写坏会拖死
      # 设备上的 dsh 启动——打包前先卡语法与载荷完整性。
      - name: Asset scripts gate（脚本语法 + 载荷完整性）
        run: node tools/check-asset-scripts.cjs

      # 引导期资产供给门禁（review-r12）：比对 Kotlin 启动命令引用的 files 级脚本
      # 与 Kotlin 实际拷贝的资产清单。打包前卡关——这类断链的后果是
      # 「装完打不开」，只能靠用户反馈发现。
      - name: Boot assets gate（引导脚本供给一致性）
        run: node tools/check-boot-assets.cjs

      # ABI 门禁：打包前核对内置 node 归档的 ELF 架构与文件名声明一致。
      # 这是本轮最要紧的一道——错 ABI 的包装到真机是「引擎启动即崩」
      # 而非「功能缺失」，且 debug/release 都受影响（参考坑 18/30）。
      - name: ABI gate（内置 node ELF 架构核对）
        run: node tools/check-asset-abi.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 build-tools;36.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          VARIANT="${{ inputs.variant || 'release' }}"
          case "$VARIANT" in
            debug)
              ./gradlew :app:assembleDebug --no-daemon ;;
            release)
              ./gradlew :app:assembleRelease --no-daemon ;;
            both)
              ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon ;;
            *)
              echo "unknown variant: $VARIANT"; exit 1 ;;
          esac

      - name: Upload debug APK artifact
        if: ${{ github.event_name == 'push' || inputs.variant == 'debug' || inputs.variant == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload release APK artifact
        if: ${{ github.event_name == 'push' || inputs.variant == 'release' || inputs.variant == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
