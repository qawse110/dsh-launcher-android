name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        type: choice
        default: debug
        options:
          - debug
          - release
          - both
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 资产脚本门禁（review-r5）：打包含 stub 与 patched/ 载荷，脚本写坏会拖死
      # 设备上的 dsh 启动——打包前先卡语法与载荷完整性。
      - name: Asset scripts gate（脚本语法 + 载荷完整性）
        run: node tools/check-asset-scripts.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 build-tools;36.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          VARIANT="${{ inputs.variant || 'release' }}"
          case "$VARIANT" in
            debug)
              ./gradlew :app:assembleDebug --no-daemon ;;
            release)
              ./gradlew :app:assembleRelease --no-daemon ;;
            both)
              ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon ;;
            *)
              echo "unknown variant: $VARIANT"; exit 1 ;;
          esac

      - name: Upload debug APK artifact
        if: ${{ github.event_name == 'push' || inputs.variant == 'debug' || inputs.variant == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload release APK artifact
        if: ${{ github.event_name == 'push' || inputs.variant == 'release' || inputs.variant == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
